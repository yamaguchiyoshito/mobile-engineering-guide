name: Check external links
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: check
        run: python3 scripts/check_links.py | tee link-check.txt
        continue-on-error: true
      - if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "外部リンクの到達確認に失敗（$(date -u +%Y-%m-%d)）" --body-file link-check.txt --label documentation || gh issue create --title "外部リンクの到達確認に失敗（$(date -u +%Y-%m-%d)）" --body-file link-check.txt
      - if: steps.check.outcome == 'failure'
        run: exit 1
